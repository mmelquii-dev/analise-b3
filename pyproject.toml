[project]
name = "bigdata-finance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mmelquii-dev", email = "mmelquii.deb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.65.0",
    "yfinance>=1.7.0",
]

[project.scripts]
bigdata-finance = "bigdata_finance:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pyrefly]
preset = "basic"
search-path = ["."]


[tool.pyright]
extraPaths = ["."]

